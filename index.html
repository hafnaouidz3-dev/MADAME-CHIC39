<script>

function calculate(){

  let price =
    document.getElementById("price").value;

  let months =
    document.getElementById("months").value;

  if(price && months){

    let result =
      (price / months).toFixed(2);

    document.getElementById("result").innerHTML =
      "القسط الشهري تقريباً: " +
      result +
      " دج";

}
